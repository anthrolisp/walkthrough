<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Walk-through notes</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1f1d1a;--muted:#6b665e;--line:#e4dfd6;--accent:#1d5c4a;--soft:#eef5f1}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--card:#201f1c;--ink:#ece8e1;--muted:#a49e94;--line:#36332e;--accent:#7cc4a8;--soft:#1f2b26}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:760px;margin:0 auto;padding:0 14px 60px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
h1{font-size:1.15rem;margin:0 0 8px}
select,button,input{font:inherit}
#jump{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center}
summary::-webkit-details-marker{display:none}
.num{grid-row:span 2;background:var(--accent);color:var(--card);font-weight:700;border-radius:999px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.nm{font-weight:650}
.when{color:var(--muted);font-size:.85rem}
.intro summary{grid-template-columns:1fr}
details[open]>summary{border-bottom:1px solid var(--line);background:var(--soft)}
.body{padding:4px 14px 14px}
.body p{margin:.7em 0}
.body ul{padding-left:1.2em;margin:.5em 0}
.body li{margin:.3em 0}
ul.task-list,.body ul:has(input[type=checkbox]){list-style:none;padding-left:0}
.body input[type=checkbox]{width:20px;height:20px;vertical-align:-4px;margin-right:8px;accent-color:var(--accent)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.6em 0}
table{border-collapse:collapse;font-size:.85rem;min-width:560px}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
th{background:var(--soft)}
a{color:var(--accent)}
.tools{display:flex;gap:8px;margin-top:8px}
.tools button{flex:1;padding:7px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#gate{max-width:360px;margin:18vh auto 0;padding:0 16px;text-align:center}
#gate input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:10px 0}
#gate button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--card);font-weight:650}
#err{color:#c0392b;min-height:1.4em;font-size:.9rem}
</style>
</head>
<body>
<form id="gate">
  <p>Private page. Enter the password.</p>
  <input id="pw" type="password" autocomplete="current-password" autofocus>
  <button type="submit">Open</button>
  <p id="err"></p>
</form>
<main id="app" hidden></main>

const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:ub(P.s), iterations:P.n, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:ub(P.i)}, key, ub(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){
  document.getElementById('gate').hidden = true;
  const app = document.getElementById('app');
  app.innerHTML = html; app.hidden = false;
  const hdr = app.querySelector('header');
  hdr.insertAdjacentHTML('beforeend','<div class="tools"><button data-a="open">Open all</button><button data-a="close">Close all</button></div>');
  hdr.addEventListener('click', e => {
    const a = e.target.dataset && e.target.dataset.a; if(!a) return;
    app.querySelectorAll('details.house').forEach(d => d.open = (a === 'open'));
  });
  document.getElementById('jump').addEventListener('change', e => {
    const d = document.getElementById(e.target.value); if(!d) return;
    d.open = true;
    window.scrollTo(0, d.getBoundingClientRect().top + window.scrollY - hdr.offsetHeight - 8);
    e.target.value = '';
  });
  // Ticks on the Ask lists stay on this phone.
  app.querySelectorAll('input[type=checkbox]').forEach((cb, i) => {
    const k = 'wt-cb-' + i;
    cb.checked = store.get(k) === '1';
    cb.addEventListener('change', () => store.set(k, cb.checked ? '1' : '0'));
  });
}
document.getElementById('gate').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  try { show(await unlock(pw)); store.set('wt-pw', pw); }
  catch(err){ document.getElementById('err').textContent = 'That password did not work.'; }
});
(async () => { const pw = store.get('wt-pw'); if(pw){ try { show(await unlock(pw)); } catch(e){} } })();
